name: Release installers
# Push a tag like v0.1.0 to build the desktop installers and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Existing tag to build and attach to", required: true }
permissions:
  contents: write
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "AppForge $TAG" --generate-notes --prerelease

  installers:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--mac --arm64" }   # Apple Silicon
          - { os: macos-15-intel, args: "--mac --x64" }         # Intel
          - { os: windows-latest, args: "--win --x64" }
          - { os: ubuntu-latest, args: "--linux --x64" }
    runs-on: ${{ matrix.os }}
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-agent.mjs
      - run: npm ci
        working-directory: desktop
      - run: npx electron-builder ${{ matrix.args }} --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned for now; the download page says so
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          shopt -s nullglob
          files=(dist/installers/AppForge-*.dmg dist/installers/AppForge-*.exe dist/installers/AppForge-*.AppImage)
          [ ${#files[@]} -gt 0 ] || { echo "no installers produced"; ls -R dist/installers | head -50; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
