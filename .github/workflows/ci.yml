name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: appowner, POSTGRES_PASSWORD: x, POSTGRES_DB: appforge_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U appowner" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The same API suite again on a real Postgres through the `pg` driver (RLS, transactions, advisory-locked migrations).
      - run: pnpm --filter @appforge/api test
        env: { TEST_DATABASE_URL: "postgres://appowner:x@localhost:5432/appforge_test" }
      - run: pnpm --filter @appforge/web build
      - run: pnpm --filter @appforge/web exec playwright install --with-deps chromium
      - run: pnpm --filter @appforge/web e2e
        env: { CI: "1" }
      - run: pnpm --filter @appforge/runtime exec expo export --platform android --output-dir dist
        env: { CI: "1", EXPO_NO_TELEMETRY: "1" }
      - run: pnpm --filter @appforge/runtime exec expo export --platform ios --output-dir dist-ios
        env: { CI: "1", EXPO_NO_TELEMETRY: "1" }

  # Builds the production image and checks that it boots and serves both the API and the web app.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t appforge .
      - run: docker run -d --name af -p 3000:3000 -p 8787:8787 appforge
      - run: |
          for i in $(seq 1 60); do curl -fs http://localhost:8787/health && break; sleep 2; done
          curl -fs http://localhost:8787/health | grep -q '"llm":"mock"'
          curl -fs http://localhost:3000/en | grep -qi appforge
          curl -fs http://localhost:3000/api/v1/me | grep -q '"user":null'
      - if: failure()
        run: docker logs af

  # The desktop agent: bundles API + web, starts them the way the installer does, and checks they serve a signed-in-by-default app.
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-agent.mjs
      - run: |
          node desktop/cli.mjs "$RUNNER_TEMP/af-data" > agent.log 2>&1 &
          for i in $(seq 1 90); do grep -q "AppForge is running" agent.log && break; sleep 1; done
          cat agent.log
          URL=$(grep -o "http://localhost:[0-9]*" agent.log | tail -1)
          curl -fs "$URL/api/v1/me" | grep -q '"owner@appforge.local"'
          curl -fs -X POST "$URL/api/v1/apps" -H 'content-type: application/json' -d '{"prompt":"coffee shop"}' | grep -q '"spec"'
          curl -fs "$URL/en" | grep -qi "describe the app"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/api/v1/apps" -H 'origin: https://evil.example' -H 'content-type: text/plain' -d '{}')" = 403
      - if: failure()
        run: cat agent.log || true
