services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: appforge
      POSTGRES_PASSWORD: appforge
      POSTGRES_DB: appforge
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/api/migrations:/docker-entrypoint-initdb.d:ro
volumes:
  pgdata:
